openapi: 3.1.0
info:
  title: Slack Connector API
  version: 1.0.0
  description: Gamma Platform connector for Slack
servers:
  - url: http://localhost:3000
    description: Development
paths:
  /api/connectors/slack/status:
    get:
      summary: Get connector status
      responses:
        '200':
          description: Connector status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  connector:
                    type: string
                  service:
                    type: string
