# EV-OPS-01/02 — Production monitoring (read-only public checks)
# Persistent cloud scheduler: GitHub Actions cron once per hour.
# GitHub executes `schedule` only from the repository default branch (`main`).
# This workflow intentionally checks out the monitor engine branch so
# main can host ONLY the workflow file (+ ignore-build helpers) after Director
# approval — without merging application changes.
#
# Live alerts: require repository secrets + MONITORING_ALERT_EMITTER=cloud.
# Windows host task EV-OPS-01-Production-Monitor must remain Disabled so only
# the cloud runner sends live mail (cross-runner dedupe).
name: EV-OPS-01 Production Monitor

on:
  schedule:
    # Once per hour (UTC). Replaces prior */5 schedule (EVS-24).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run_alerts:
        description: "Force dry-run alert delivery for monitor cycle (true/false)"
        required: false
        default: "true"
      mode:
        description: "monitor (default health cycle) or controlled_test (one labelled email via Actions secrets)"
        required: false
        default: "monitor"

concurrency:
  group: ev-ops-01-production-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monitor engine
        uses: actions/checkout@v4
        with:
          ref: cursor/ev-ops-01-monitoring-repair-c170

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore monitor incident state
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'controlled_test' }}
        uses: actions/cache@v4
        with:
          path: ops/ev-ops-01/var/state.json
          key: ev-ops-01-state-${{ github.run_id }}
          restore-keys: |
            ev-ops-01-state-

      - name: Controlled test email (Actions secrets only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'controlled_test' }}
        env:
          MONITORING_RUNNER: cloud
          MONITORING_ALERT_EMITTER: ${{ secrets.MONITORING_ALERT_EMITTER }}
          MONITORING_ALERTS_LIVE: "0"
          MONITORING_ALERT_TO: ${{ secrets.MONITORING_ALERT_TO }}
          MONITORING_ALERT_FROM: ${{ secrets.MONITORING_ALERT_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EV_OPS_01_VAR_DIR: ${{ github.workspace }}/ops/ev-ops-01/var
          GITHUB_ACTIONS: "true"
        run: node ops/ev-ops-01/send-controlled-test.mjs

      - name: Run Production monitoring cycle
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'controlled_test' }}
        env:
          MONITORING_RUNNER: cloud
          MONITORING_ALERT_EMITTER: ${{ secrets.MONITORING_ALERT_EMITTER || 'cloud' }}
          MONITORING_ALERTS_LIVE: ${{ secrets.MONITORING_ALERTS_LIVE || '0' }}
          MONITORING_ALERT_TO: ${{ secrets.MONITORING_ALERT_TO }}
          MONITORING_ALERT_FROM: ${{ secrets.MONITORING_ALERT_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EV_OPS_01_VAR_DIR: ${{ github.workspace }}/ops/ev-ops-01/var
          MONITORING_FORCE_DRY_RUN: ${{ github.event.inputs.dry_run_alerts || 'true' }}
        run: |
          if [ "${MONITORING_FORCE_DRY_RUN}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export MONITORING_ALERTS_LIVE=0
          fi
          node ops/ev-ops-01/run-check.mjs

      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev-ops-01-evidence-${{ github.run_id }}
          path: ops/ev-ops-01/var/**
          retention-days: 30
          if-no-files-found: warn
